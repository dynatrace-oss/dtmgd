version: "2"

run:
  # Lint the live integration suite too (test/integration).
  build-tags:
    - integration

linters:
  enable:
    - gosec
    - staticcheck
    - errcheck
    - govet
    - ineffassign
    - unused
    - misspell
    # Matches SonarCloud's go:S3776 limit, so the gate is checked locally.
    - gocognit

  settings:
    gosec:
      severity: medium
      confidence: medium
    gocognit:
      min-complexity: 15

  exclusions:
    rules:
      # Test files: relax some rules
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - gocognit
