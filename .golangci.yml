version: "2"

linters:
  enable:
    - gosec
    - staticcheck
    - errcheck
    - govet
    - ineffassign
    - unused
    - misspell

  settings:
    gosec:
      severity: medium
      confidence: medium

  exclusions:
    rules:
      # Test files: relax some rules
      - path: _test\.go
        linters:
          - gosec
          - errcheck
