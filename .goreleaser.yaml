version: 2
project_name: dtmgd

before:
  hooks:
    - go mod tidy
    - go build -o /tmp/dtmgd-completions .
    - sh -c "mkdir -p completions && /tmp/dtmgd-completions completion bash > completions/dtmgd.bash"
    - sh -c "/tmp/dtmgd-completions completion zsh > completions/dtmgd.zsh"
    - sh -c "/tmp/dtmgd-completions completion fish > completions/dtmgd.fish"

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/dynatrace-oss/dtmgd/pkg/version.Version={{.Version}}
      - -X github.com/dynatrace-oss/dtmgd/pkg/version.Commit={{.ShortCommit}}
      - -X github.com/dynatrace-oss/dtmgd/pkg/version.Date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE*
      - README*
      - src: skills/dtmgd/SKILL.md
        strip_parent: true
      - completions/*
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

homebrew_casks:
  - repository:
      owner: ivan-gudak
      name: homebrew-tap
      branch: "{{ .ProjectName }}-{{ .Version }}"
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: dynatrace-oss
          name: homebrew-tap
          branch: main
    homepage: https://github.com/dynatrace-oss/dtmgd
    description: "kubectl-inspired CLI for Dynatrace Managed - problems, entities, events, logs, metrics, SLOs, and security from your terminal"
    skip_upload: auto
    completions:
      bash: completions/dtmgd.bash
      zsh: completions/dtmgd.zsh
      fish: completions/dtmgd.fish
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/dtmgd"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - 'Merge pull request'
      - 'Merge branch'
