version: 2
project_name: dtmgd

before:
  hooks:
    - go build -o /tmp/dtmgd-completions .
    - sh -c "mkdir -p completions && /tmp/dtmgd-completions completion bash > completions/dtmgd.bash"
    - sh -c "/tmp/dtmgd-completions completion zsh > completions/dtmgd.zsh"
    - sh -c "/tmp/dtmgd-completions completion fish > completions/dtmgd.fish"

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/dynatrace-oss/dtmgd/pkg/version.Version={{.Version}}
      - -X github.com/dynatrace-oss/dtmgd/pkg/version.Commit={{.ShortCommit}}
      - -X github.com/dynatrace-oss/dtmgd/pkg/version.Date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE*
      - README*
      - src: skills/dtmgd/SKILL.md
        strip_parent: true
      # Beside SKILL.md, so its relative links to references/ work.
      - src: skills/dtmgd/references/*
        dst: references
        strip_parent: true
      - completions/*
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'

signs:
  # cosign v3 writes one Sigstore bundle; checksums.txt is signed into
  # checksums.txt.sigstore.json. Verification is in README (Verifying a download).
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]

sboms:
  - artifacts: archive
    cmd: syft
    args: ["${artifact}", "--output", "spdx-json=${document}"]

snapshot:
  version_template: "{{ incpatch .Version }}-next"

homebrew_casks:
  # Committed straight to the tap's main branch, as dtctl does (#58). The
  # token needs write access to dynatrace-oss/homebrew-tap: release.yml mints
  # one from the tap's GitHub App when its secrets are available.
  - repository:
      owner: dynatrace-oss
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/dynatrace-oss/dtmgd
    description: "kubectl-inspired CLI for Dynatrace Managed - problems, entities, events, logs, metrics, SLOs, and security from your terminal"
    skip_upload: auto
    completions:
      bash: completions/dtmgd.bash
      zsh: completions/dtmgd.zsh
      fish: completions/dtmgd.fish
    hooks:
      post:
        # Homebrew's install-steps DSL (postflight_steps), in Homebrew since
        # 2026-08; the Ruby postflight block is deprecated.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/dtmgd"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs(\(.*\))?:'
      - '^test(\(.*\))?:'
      - '^ci(\(.*\))?:'
      - '^build\(deps\)'
      - '^chore\(deps\)'
      - 'Merge pull request'
      - 'Merge branch'
