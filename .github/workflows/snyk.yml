name: Snyk

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  snyk:
    runs-on: ubuntu-latest
    # Requires SNYK_API_TOKEN as a repository secret:
    # Settings → Secrets and variables → Actions → New repository secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/golang@12140f4059e244892ae643824a95459a102120dd # master @ 2026-08-03
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_API_TOKEN }}
        with:
          args: --severity-threshold=high --org=e16245a7-d909-49b0-b72d-52af7b45a469 --all-projects
