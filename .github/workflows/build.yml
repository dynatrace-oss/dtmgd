name: Build

# Runs the release's own GoReleaser config end to end except publishing and
# signing, on main only: every target, archive and the cask, so a broken
# archive file list shows here, not at tag time. PRs get goreleaser-check
# (lint.yml) and the tests on three OSes.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: v2.19.0 # keep in step with release.yml
          args: release --snapshot --clean --skip=publish,sign,sbom
