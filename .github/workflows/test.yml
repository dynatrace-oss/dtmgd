name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # No GOTOOLCHAIN preset here: setup-go only honours go.mod's toolchain
    # line when GOTOOLCHAIN is not "local", and after installing that version
    # it exports GOTOOLCHAIN=local itself, so go test cannot switch mid-run.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download
        shell: bash

      - name: Build
        run: go build ./...
        shell: bash

      - name: Vet
        run: go vet ./...
        shell: bash

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
        shell: bash

      - name: Check coverage threshold
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          # go tool cover -func only counts statements inside named
          # functions. Until the cmd refactor, every command's RunE was a
          # closure in a package-level var, so most of cmd was invisible to
          # this total (75% here while cmd itself was at 33%). Now commands
          # are constructors and the total is honest. 54 is that honest
          # baseline; Phase 2 raises it back to 60 once its command tests land.
          THRESHOLD=54
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi
