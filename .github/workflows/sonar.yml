name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonar:
    # Dependabot PRs (and forks) cannot access repository secrets, so the
    # SonarCloud scan cannot run there. Skip the job for Dependabot instead of
    # reporting a misleading green "passing" check. Pushes to main and normal
    # PRs still run the real scan.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # required for SonarCloud blame/history analysis

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        run: go test -race -coverprofile=coverage.out ./...

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

      - name: SonarCloud Scan Unavailable
        if: env.SONAR_TOKEN == ''
        run: echo "Skipping SonarCloud scan because SONAR_TOKEN is not available in this workflow context."
