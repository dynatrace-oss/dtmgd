name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonar:
    runs-on: ubuntu-latest
    # continue-on-error: SONAR_TOKEN is present but not authorized for project
    # dynatrace-oss_dtmgd, so every run fails with "Not authorized or project
    # not found". The scan result is reported but does not block merges. Remove
    # this once the token has Execute Analysis permission, so that quality-gate
    # failures gate again.
    continue-on-error: true
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # required for SonarCloud blame/history analysis

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        run: go test -race -coverprofile=coverage.out ./...

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

      - name: SonarCloud Scan Unavailable
        if: env.SONAR_TOKEN == ''
        run: echo "Skipping SonarCloud scan because SONAR_TOKEN is not available in this workflow context."
